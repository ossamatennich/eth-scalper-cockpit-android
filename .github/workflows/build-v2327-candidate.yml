name: Version candidate de l'APK v2.32.8 TP-SL Only

on:
  push:
    branches:
      - agent/v2.32.7-scalp-p01-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETH-Scalper-Cockpit-v2.32.8-debug-apk
          path: app/build/outputs/apk/debug/*.apk
