name: NMC v2.34.1.1 reliable audible final signal alerts

on:
  push:
    branches:
      - agent/v2.32.7-scalp-p01-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Debug unit tests
        run: gradle testDebugUnitTest
      - name: All unit tests
        run: gradle test
      - name: Python SOL profile validator tests
        run: python3 -m unittest tools/test_validate_sol_profile.py
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release APK
        run: gradle assembleRelease
      - name: Release lint
        run: gradle lintRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMC-v2.34.1.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
