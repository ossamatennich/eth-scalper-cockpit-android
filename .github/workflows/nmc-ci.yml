name: NMC v2.34.6.2 Stable CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NMC_SIGNING_STORE_PASSWORD: ${{ secrets.NMC_SIGNING_STORE_PASSWORD }}
      NMC_SIGNING_KEY_ALIAS: ${{ secrets.NMC_SIGNING_KEY_ALIAS }}
      NMC_SIGNING_KEY_PASSWORD: ${{ secrets.NMC_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare durable NMC signing key
        shell: bash
        env:
          NMC_SIGNING_STORE_BASE64: ${{ secrets.NMC_SIGNING_STORE_BASE64 }}
        run: |
          test -n "$NMC_SIGNING_STORE_BASE64"
          printf '%s' "$NMC_SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nmc-stable-v1.jks"
          echo "NMC_SIGNING_STORE_FILE=$RUNNER_TEMP/nmc-stable-v1.jks" >> "$GITHUB_ENV"
      - name: Debug unit tests
        run: gradle testDebugUnitTest --rerun-tasks
      - name: Stable unit tests
        run: gradle testStableUnitTest --rerun-tasks
      - name: Release unit tests
        run: gradle testReleaseUnitTest --rerun-tasks
      - name: All unit tests
        run: gradle test --rerun-tasks
      - name: SOL profile validator tests
        run: python3 -m unittest tools/test_validate_sol_profile.py
      - name: Install causal research dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/research-requirements.txt
      - name: Causal research laboratory tests
        run: python3 -m unittest tools/test_scalp_research.py
      - name: Microstructure capture research tests
        run: python3 -m unittest tools/test_microstructure_research.py
      - name: Build stable APK
        run: gradle assembleStable
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release APK
        run: gradle assembleRelease
      - name: Release lint
        run: gradle lintRelease
      - name: Verify stable APK identity and signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/stable/app-stable.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/stable/app-stable.apk | head -n 3
      - name: Enable KVM for Android launch smoke test
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Stable launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: sh .github/scripts/android-launch-smoke.sh
      - name: Upload Android launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NMC-v2.34.6.2-launch-smoke
          path: ${{ runner.temp }}/nmc-screen.png
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMC-v2.34.6.2-stable-apk
          path: app/build/outputs/apk/stable/app-stable.apk
          if-no-files-found: error
