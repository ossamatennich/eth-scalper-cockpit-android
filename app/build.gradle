plugins { id 'com.android.application' }

def stableStoreFile = System.getenv('NMC_SIGNING_STORE_FILE')
def stableStorePassword = System.getenv('NMC_SIGNING_STORE_PASSWORD')
def stableKeyAlias = System.getenv('NMC_SIGNING_KEY_ALIAS')
def stableKeyPassword = System.getenv('NMC_SIGNING_KEY_PASSWORD')
def stableSigningAvailable = stableStoreFile && stableStorePassword && stableKeyAlias && stableKeyPassword

android {
    namespace 'com.ethscalper.cockpit'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.ethscalper.cockpit'
        minSdk 26
        targetSdk 35
        versionCode 23452
        versionName '2.34.5.2'
        manifestPlaceholders = [appLabel: 'NMC']
    }

    signingConfigs {
        nmcStable {
            if (stableSigningAvailable) {
                storeFile file(stableStoreFile)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
        stable {
            initWith debug
            applicationIdSuffix '.stable'
            manifestPlaceholders = [appLabel: 'NMC Stable 5.2']
            signingConfig stableSigningAvailable ? signingConfigs.nmcStable : signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            maxHeapSize = '128m'
            maxParallelForks = 1
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
